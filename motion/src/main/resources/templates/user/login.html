<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .motion {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .motionContainer {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
      }
      .motionContainer__title {
        border-bottom: 1px solid #ccc;
        margin-bottom: 30px;
        width: 300px;
      }
      .motionContainer__title img {
        width: 40px;
        height: 40px;
      }
      .motionContainer__title__text {
        line-height: 0.5;
      }
      .motionContainer__title__text h2 {
        font-size: 1.3rem;
      }
      .subTitle {
        color: #a19e9a;
      }
      .motionContainer__form {
        width: 300px;
        text-align: left;
      }

      .motionContainer__form label {
        display: block;
        margin-bottom: 6px;
        color: #7d7a76;
        font-size: 0.8rem;
        font-weight: bold;
      }
      .motionContainer__form input[type="text"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        margin-bottom: 10px;
        box-sizing: border-box;
      }

      .motionContainer__form input[type="button"] {
        width: 100%;
        padding: 10px;
        background-color: #227fdb;
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
      }

      .motionContainer__form input[type="button"]:hover {
        background-color: #1e6fc2;
      }
      .motionContainer__form p {
        font-size: 0.8rem;
        color: #bab7b4;
        margin: 0;
        margin-bottom: 20px;
      }
      .motionContainer__row {
        margin-top: 30px;
        width: 230px;
      }
      .motionContainer__row p {
        font-size: 0.8rem;
        color: #7d7a76;
      }
      .motionContainer__row a {
        color: #888;
      }
      .motionContainer__row a:hover {
        color: #2683de;
      }
    </style>
  </head>
  <body>
      <section class="motion">
        <div class="motionContainer">
          <div class="motionContainer__title">
            <img src="/images/motionLogo.png" />
            <div class="motionContainer__title__text">
              <h2>나만의 워크스페이스</h2>
              <h2 class="subTitle">Motion 계정에 로그인</h2>
            </div>
          </div>
          <div class="motionContainer__form">
            <div class="motionContaier__form__label">
              <label>이메일</label>
            </div>
            <div>
              <input
                type="text"
                name="email"
                id="email"
                placeholder="이메일 주소를 입력하세요."
              />
              <div id="authArea" style="display: none">
                  <label>인증 코드</label>
                  <input type="text" name="authCode" id="authCode" placeholder="코드 입력"/>
                  <p>수신함으로 코드를 보내드렸습니다.</p>
              </div>
              <input type="button" value="계속" onclick="authEmail()"/>
            </div>
          </div>
          <div class="motionContainer__row">
            <p>
              계속 진행하면 
              <a href="#">이용약관</a> <span>및 </span>
              <a href="#">개인정보처리방침을 이해하고 동의하는 것으로 간주됩니다.</a>
            </p>
          </div>
        </div>
      </section>
  </body>
  <script>
    var xhr = null;
    function getXHR(){
      if(window.ActiveXObject){ 
        return new ActiveXObject('Msxml2.XMLHTTP');
      }else if(window.XMLHttpRequest){
        return new XMLHttpRequest(); 
      }else{
        return null;
      }
    }
    function authEmail(){
      // 인증 코드를 입력했다면 함수 이동
      var authCode = document.getElementById("authCode").value;
      if (authCode !== "") {
        authCodeCheck();
        return;
      }

      var email = document.getElementById('email').value;

      if (email.trim() == "") {
        alert("이메일을 입력해주세요.");
        return;
      }

      if (!email.includes("@") || !email.includes(".")) {
        alert("올바른 이메일 형식이 아닙니다.");
        return;
      }

      xhr = getXHR();
      xhr.onreadystatechange=authEmailResult;
      xhr.open('POST', '/auth/send-code', true);
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.send('email=' + encodeURIComponent(email));      
    }
    function authEmailResult(){
       if (xhr.readyState == 4) {
        if (xhr.status == 200) {
          var result = xhr.responseText;

          if(result == 'ok'){
            alert("인증코드가 이메일로 전송되었습니다.");
            document.getElementById("authArea").style.display = "block";
          }else{
            alert('등록된 이메일이 존재하지 않습니다.');
            document.getElementById('email').value='';
            return;
          }
        }
      }
    }
    function authCodeCheck() {
      var authCode = document.getElementById("authCode").value;

      xhr = getXHR();
      xhr.onreadystatechange = authCodeCheckResult;
      xhr.open('POST', '/authCodeCheck', true);
      xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
      xhr.send("authCode=" + authCode);
    }
    function authCodeCheckResult(){
      if(xhr.readyState == 4){
        if(xhr.status == 200){
          var result = xhr.responseText;

          if(result == 'ok'){
            alert('로그인되었습니다.');
            window.location.href='/';
          }else{
            alert('인증 코드가 잘못되었습니다.');
            document.getElementById('authCode').value='';
          }
        }
      }
    }
  </script>
</html>
